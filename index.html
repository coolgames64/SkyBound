<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10282c"><meta name="apple-mobile-web-app-capable" content="yes"><title>Skybound — Flight Simulator</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07171e;color:#edf5f3;font-family:system-ui,sans-serif}#game{width:100%;height:100%;display:block;touch-action:none}#cover{position:fixed;inset:0;display:grid;place-content:center;background:radial-gradient(ellipse at 70% 20%,#25505c,#07171e 75%);padding:30px;text-align:center}h1{letter-spacing:.3em;font-size:clamp(28px,7vw,56px);margin:0 0 12px}p{color:#acc2c8;max-width:540px;line-height:1.6}button{background:#daf995;color:#10282c;border:0;border-radius:8px;padding:17px 30px;font-size:17px;font-weight:700;cursor:pointer}progress{width:100%;accent-color:#daf995;margin:22px 0;height:8px}#status{font-size:14px}#full{position:fixed;right:12px;top:12px;padding:8px 12px;font-size:12px;opacity:.8;z-index:2}#rotate{display:none;position:fixed;bottom:8px;left:50%;transform:translateX(-50%);padding:8px 14px;background:#10282ce8;border-radius:8px;pointer-events:none;font-size:12px;z-index:3}@media(orientation:portrait) and (pointer:coarse){#rotate{display:block}}
</style></head><body><canvas id="game" tabindex="0" aria-label="Skybound flight simulator"></canvas><button id="full" hidden>Full screen</button><div id="cover"><h1>SKYBOUND</h1><p>The world is your runway.<br>Real satellite scenery. Free flight. Emergency challenges.</p><button id="start">Start simulator ↗</button><progress id="progress" hidden max="1" value="0"></progress><p id="status">Keyboard, mouse and touch controls.<br>On a phone, turn sideways for the best view.</p><p style="font-size:12px">Scenery requires internet. Your first flight may take a moment to load.</p></div><div id="rotate">Turn your phone sideways for flight controls</div>
<script src="chunk-loader.js"></script><script>
const canvas=document.querySelector('#game'),cover=document.querySelector('#cover'),statusText=document.querySelector('#status'),progress=document.querySelector('#progress'),start=document.querySelector('#start'),full=document.querySelector('#full');let instance;
start.onclick=()=>{start.hidden=true;progress.hidden=false;statusText.textContent='Loading your aircraft and world…';const script=document.createElement('script');script.src='Build/SkyboundWeb.loader.js';script.onerror=()=>fail('A required game file could not load: Build/SkyboundWeb.loader.js. The website may be missing its Build folder. This does not necessarily mean your internet is offline.');script.onload=()=>{const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);createUnityInstance(canvas,{dataUrl:'Build/SkyboundWeb.data.unityweb',frameworkUrl:'Build/SkyboundWeb.framework.js.unityweb',codeUrl:'Build/SkyboundWeb.wasm.unityweb',streamingAssetsUrl:'StreamingAssets',companyName:'Skybound',productName:'Skybound Flight Simulator',productVersion:'0.6.0-web',devicePixelRatio:Math.min(window.devicePixelRatio||1,mobile?1.25:1.5),showBanner:(message,type)=>{if(type==='error')fail(message)}},p=>{progress.value=p;statusText.textContent='Loading simulator · '+Math.round(p*100)+'%'}).then(u=>{instance=u;cover.hidden=true;cover.style.display='none';full.hidden=false;canvas.focus();window.skyboundReady=true}).catch(e=>fail(String(e)))};document.body.appendChild(script)};
function fail(message){cover.hidden=false;cover.style.display='grid';statusText.textContent=message;progress.hidden=true;start.hidden=false;start.textContent='Reload simulator';start.onclick=()=>location.reload()}
full.onclick=()=>{if(instance)instance.SetFullscreen(1)};canvas.addEventListener('contextmenu',e=>e.preventDefault());canvas.addEventListener('pointerdown',()=>canvas.focus());
</script></body></html>
